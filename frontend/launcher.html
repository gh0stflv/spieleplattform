<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spieleplattform</title>
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>
  <header class="kopf">
    <a class="logo" href="launcher.html">🕹️ Spieleplattform</a>
  </header>
  <main>
    <section id="auswahl">
      <h1>Wähle ein Spiel</h1>
      <div id="kacheln" class="kacheln"></div>
    </section>

    <section id="buehne" class="buehne" hidden>
      <div class="buehne-kopf">
        <button type="button" class="knopf leise" id="zurueck">← Spiele</button>
        <h2 id="spiel-titel"></h2>
        <span id="anzeige" class="anzeige"></span>
      </div>
      <div class="spielrahmen">
        <canvas id="spielfeld" width="480" height="480"></canvas>
        <div id="overlay" class="overlay" hidden></div>
      </div>
      <p class="tipp">Leertaste oder Esc = Pause</p>
      <p id="lan-status" class="tipp lan-status" hidden></p>
    </section>
  </main>
  <script type="module" src="js/seiten/launcher.js"></script>
</body>
</html>
